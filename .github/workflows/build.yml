name: Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Assemble debug, signed release, and unsigned release APKs
        run: gradle assembleDebug assembleRelease assembleReleaseUnsigned --no-daemon --stacktrace

      - name: Upload signed debug APK
        uses: actions/upload-artifact@v4
        with:
          name: local-notes-debug-signed
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: local-notes-release-signed
          path: app/build/outputs/apk/release/*.apk

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: local-notes-release-unsigned
          path: app/build/outputs/apk/releaseUnsigned/*.apk
